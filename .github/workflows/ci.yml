name: Pipeline CI (Lint, Build & Test)

on:
  push:
    branches: [integration, staging, main]
  pull_request:
    branches: [integration, staging, main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environnement cible"
        required: true
        default: Integration
        type: choice
        options:
          - Integration
          - Staging
          - Prod

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: Integration
            branch: integration
          - environment: Staging
            branch: staging
          - environment: Prod
            branch: main
    environment: ${{ matrix.environment }}
    env:
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Afficher l'environnement cible
        run: echo "Environnement=${{ matrix.environment }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Initialiser la base de test
        run: |
          psql "$DATABASE_URL" <<'SQL'
          CREATE TABLE IF NOT EXISTS events (
            id SERIAL PRIMARY KEY,
            title TEXT NOT NULL,
            date TEXT NOT NULL,
            description TEXT DEFAULT NULL,
            participants INTEGER DEFAULT NULL,
            categorie TEXT DEFAULT NULL,
            lieu TEXT DEFAULT NULL
          );
          SQL

      - name: Vérifier API_PASSWORD
        shell: bash
        run: |
          if [ -z "$API_PASSWORD" ]; then
            echo "::error::Le secret GitHub API_PASSWORD est manquant ou vide."
            exit 1
          fi

      - name: Masquer API_PASSWORD dans les logs
        run: echo "::add-mask::$API_PASSWORD"

      - name: Verifier les variables d'environnement
        run: |
          chmod +x scripts/check-env.sh
          ./scripts/check-env.sh

      - name: Tests (Jest)
        run: npm test -- --coverage

      - name: Upload rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.environment }}
          path: coverage/
          retention-days: 7
